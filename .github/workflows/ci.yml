name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

env:
  # The code whose mutants mutants tests, and so the list mutants-plan shards.
  MUTANTS_FILES: crates/{analyzer,semantics,sharp-bridge}/src/**

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, nightly]
        exclude:
          - { os: macos-latest, rust: nightly }

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: keep local sources out of Cargo.lock
        if: matrix.os == 'macos-latest'
        run: |
          if git grep -nE '(path|git)\+file://' -- '*Cargo.lock'; then
            echo "::error::A committed Cargo.lock names a local source. Keep the [patch] in an untracked .cargo/config.toml."
            exit 1
          fi

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: cache rust toolchain
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-rust-${{ matrix.rust }}
          shared-key: ${{ runner.os }}-rust-${{ matrix.rust }}
          cache-on-failure: true

      - name: Install PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install composer dependencies
        run: composer install

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install elan and Lean
        uses: ./.github/actions/setup-lean

      - name: Test PHP SDK
        run: just test-sdk

      - name: cargo check
        if: matrix.os == 'macos-latest'
        run: cargo check --workspace --locked

      # Workspace builds merge features, so only a build of the bridge alone shows what php links.
      - name: cargo check the PHP# bridge alone
        if: matrix.os == 'macos-latest'
        run: cargo check -p mago-sharp-bridge --locked

      - name: keep the file watcher out of the PHP# bridge
        if: matrix.os == 'macos-latest'
        run: |
          if output=$(cargo tree -p mago-sharp-bridge -e normal -i notify --locked 2>&1); then
            echo "$output"
            echo "::error::mago-sharp-bridge depends on notify, so php would link a file watcher"
            exit 1
          fi
          echo "$output" | grep -q "did not match any packages"

      - name: Verify the PHP SDK's NodeKind is generated from the syntax tree
        if: matrix.os == 'macos-latest'
        run: |
          php scripts/regen-sdk-node-kinds.php
          git diff --exit-code composer/src/Sdk/Syntax/NodeKind.php

      - name: cargo fmt
        if: matrix.os == 'macos-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo test (property)
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo test -p mago-codex --features property-tests --locked

      # Linux builds the release binary here because the Composer steps below run it. macOS builds
      # its own in release-build, alongside the tests instead of after them.
      - name: cargo build
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo build --release --locked

      # git archive ships what Packagist ships, and a mirrored copy finds the project's autoloader the way a real install does.
      - name: install the Composer package by name
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mago") | .version')
          package="$RUNNER_TEMP/mago-sharp-package"
          project="$RUNNER_TEMP/mago-sharp-project"
          mkdir -p "$package" "$project"
          git archive HEAD | tar -x -C "$package"
          cat > "$project/composer.json" <<JSON
          {
              "repositories": [
                  {
                      "type": "path",
                      "url": "$package",
                      "options": {"symlink": false, "versions": {"heyjordanparker/mago-sharp": "$version"}}
                  }
              ],
              "require": {"heyjordanparker/mago-sharp": "$version"}
          }
          JSON
          composer install --no-interaction --working-dir="$project"
          binary_dir="$project/vendor/heyjordanparker/mago-sharp/composer/bin/$version/mago-$version-$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p "$binary_dir"
          cp target/release/mago "$binary_dir/mago"
          output=$("$project/vendor/bin/mago" --version 2>&1)
          echo "$output"
          test "$output" = "mago $version"

      - name: Validate composer code format
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: ./target/release/mago format --dry-run

      - name: Lint composer code
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: ./target/release/mago lint --reporting-format=github

      - name: Analyze composer code
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: ./target/release/mago analyze --reporting-format=github

  release-build:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: cache rust toolchain
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-rust-release
          cache-on-failure: true

      - name: cargo build
        run: cargo build --release --locked

  # cd.yml builds the WebAssembly package only for a release, so this job runs its build steps on every pull request.
  wasm-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: cache rust toolchain
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-rust-wasm
          cache-on-failure: true

      - name: Cache wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.13.1-${{ runner.os }}

      - name: Install wasm-pack and build WASM
        run: |
          if ! command -v wasm-pack &>/dev/null; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi
          cd crates/wasm
          wasm-pack build -d pkg --release

      - name: check the files cd.yml packs
        run: |
          for file in mago_wasm.d.ts mago_wasm.js mago_wasm_bg.js mago_wasm_bg.wasm package.json; do
            test -f "crates/wasm/pkg/$file" || { echo "::error::wasm-pack wrote no crates/wasm/pkg/$file"; exit 1; }
          done

  typos-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Search for misspellings
        uses: crate-ci/typos@master

  # Nightly, because only nightly honours #[coverage(off)], cargo-llvm-cov's way to exclude code that cannot run by design.
  patch-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: cache rust toolchain
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-rust-coverage
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      # Every test of the three packages, because their code is shared with plain PHP and the PHP tests cover that part.
      - name: Measure the tests' coverage
        run: cargo llvm-cov --locked -p mago-analyzer -p mago-semantics -p mago-sharp-bridge --lcov --output-path lcov.info

      # As coverage.py's exclude_lines leaves out `raise NotImplementedError`: an impossible arm is an unreachable!(…)
      # call, which no test can run. cargo-llvm-cov has no line exclusion, so its lcov loses the line's records:
      # DA, and FN, which diff-cover reads as the line of a closure such as `|| unreachable!(…)`.
      - name: Leave out the lines that call unreachable!
        run: |
          awk '
            /^SF:/ { delete unreachable; file = substr($0, 4); for (n = 1; (getline line < file) > 0; n++) if (index(line, "unreachable!(")) unreachable[n]; close(file) }
            /^(DA|FN):/ { split(substr($0, 4), record, ","); if (record[1] in unreachable) next }
            { print }
          ' lcov.info > reachable.info

      - name: Every line the pull request adds is covered
        run: |
          pipx run --spec diff-cover==10.6.0 diff-cover reachable.info \
            --compare-branch "origin/$GITHUB_BASE_REF" \
            --include 'crates/analyzer/src/**' 'crates/semantics/src/**' 'crates/sharp-bridge/src/**' \
            --format github-annotations:error \
            --fail-under 100 || {
            echo "::error::A test must run every line above. Mark a function that cannot run by design with #[cfg_attr(coverage_nightly, coverage(off))], and write an impossible arm as unreachable!(…) with its reason."
            exit 1
          }

  # Lists the pull request's mutants, so mutants runs them in shards of 6, on at most 8 runners. A mutant takes about
  # 2 minutes against every test, so a shard of 6 takes about 15.
  mutants-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      shards: ${{ steps.plan.outputs.shards }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Plan the shards
        id: plan
        run: |
          git diff "origin/$GITHUB_BASE_REF..." > pull-request.diff
          cargo mutants --list --in-diff pull-request.diff --workspace --file "$MUTANTS_FILES" > mutants.txt
          count=$(wc -l < mutants.txt)
          shards=$(( (count + 5) / 6 ))
          shards=$(( shards > 8 ? 8 : shards ))
          echo "$count mutants in $shards shards"
          echo "shards=$(jq -cn --argjson n "$shards" '[range($n)]')" >> "$GITHUB_OUTPUT"

  # Not required: a surviving mutant is a line some test runs but no test checks, and each one shows as an annotation.
  mutants:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: cache rust toolchain
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-rust-mutants
          cache-on-failure: true

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Test the pull request's mutants
        run: |
          git diff "origin/$GITHUB_BASE_REF..." > pull-request.diff
          cargo mutants --in-place --in-diff pull-request.diff --workspace --file "$MUTANTS_FILES" \
            --shard "${{ matrix.shard }}/${{ strategy.job-total }}" --baseline skip --timeout 300 --caught --unviable \
            --test-package mago-analyzer --test-package mago-semantics --test-package mago-sharp-bridge \
            --cargo-arg=--locked --cargo-arg=--tests

  # The one required check: it passes only when every job above passed, so a job added later
  # blocks merges without a change to the repository's rules. mutants reports and never blocks.
  ci-passed:
    if: always()
    needs: [build-and-test, release-build, wasm-build, typos-check, patch-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: ${{ github.event_name != 'pull_request' && 'patch-coverage' || '' }}
          jobs: ${{ toJSON(needs) }}

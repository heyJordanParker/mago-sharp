[files]
extend-exclude = [
    ".git/",
    "crates/formatter/tests/",
    "crates/codex/tests/",
    "crates/analyzer/tests/cases/",
    "crates/prelude/assets/extensions",
    "docs/",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    # Typo in cruet
    "has_seperator: false",
    '"k" \. "nown"',
    '"abd00?"\.to_string',
    "<<<FOF",
    "FOF;",
    '"nd",',
    'GTI',
    'ND',
    # A misspelled namespace an `imports` line test expects the checker to refuse
    'Illuminate\.Suport',
]

[default.extend-words]
"trivias" = "trivias"
"invokable" = "invokable"
"encrypter" = "encrypter"
"consts" = "consts"
"writeable" = "writeable"
"caf" = "caf"

[type.lean.extend-identifiers]
# Lean's names for the constant that holds a theorem and for the declaration that adds one.
"thmInfo" = "thmInfo"
"thmDecl" = "thmDecl"

[type.rust.extend-identifiers]
"thr" = "thr"

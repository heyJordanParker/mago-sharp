version = "0"
php-version = "8.1"

[source]
paths = ["composer", "scripts"]
includes = ["vendor"]
excludes = ["scripts/local"]

# A comment hides no issue, so each rule names the files it does not apply to. The SDK's worker fixtures each hold a
# worker's plugins in one script.
[linter.rules]
ambiguous-function-call = { enabled = true, level = "error" }
cyclomatic-complexity = { threshold = 6, exclude = [
    "composer/src/Sdk/Analyzer/Codebase.php",
    "composer/src/Sdk/Analyzer/EffectiveCallableSignature.php",
    "composer/src/Sdk/Analyzer/FileAnalysis.php",
    "composer/src/Sdk/Analyzer/Invocation.php",
    "composer/src/Sdk/Analyzer/Metadata/AttributeMetadata.php",
    "composer/src/Sdk/Analyzer/PluginDefinition.php",
    "composer/src/Sdk/Analyzer/SymbolReferences.php",
    "composer/src/Sdk/Analyzer/Type.php",
    "composer/src/Sdk/Analyzer/Type/FunctionLikeIdentifier.php",
    "composer/src/Sdk/Analyzer/Type/IntegerType.php",
    "composer/src/Sdk/Analyzer/TypeComparator.php",
    "composer/src/Sdk/Extension.php",
    "composer/src/Sdk/Internal/Analyzer/AssertionCodec.php",
    "composer/src/Sdk/Internal/Analyzer/DefinitionName.php",
    "composer/src/Sdk/Internal/Analyzer/MetadataCodec.php",
    "composer/src/Sdk/Internal/Analyzer/Protocol.php",
    "composer/src/Sdk/Internal/Analyzer/TypeCodec.php",
    "composer/src/Sdk/Internal/HostClient.php",
    "composer/src/Sdk/Internal/Hosts.php",
    "composer/src/Sdk/Internal/Linter/Protocol.php",
    "composer/src/Sdk/Internal/Protocol/ValueReader.php",
    "composer/src/Sdk/Internal/Syntax/NodeStore.php",
    "composer/src/Sdk/Internal/Worker/Protocol.php",
    "composer/src/Sdk/PHPVersion.php",
    "composer/src/Sdk/Syntax/CallExpression.php",
    "composer/src/Sdk/Syntax/SourceFile.php",
    "composer/src/Sdk/Worker.php",
    "composer/tests/Sdk/Fixtures/",
    "composer/tests/Sdk/Unit/WorkerTest.php",
    "scripts/publish-docs.php",
] }
excessive-parameter-list = { exclude = [
    "composer/src/Sdk/Analyzer/Argument.php",
    "composer/src/Sdk/Analyzer/CallForwardingProviderContext.php",
    "composer/src/Sdk/Analyzer/Codebase.php",
    "composer/src/Sdk/Analyzer/Declaration/ClassLikeRefinement.php",
    "composer/src/Sdk/Analyzer/Declaration/SignatureRefinement.php",
    "composer/src/Sdk/Analyzer/FileAnalysis.php",
    "composer/src/Sdk/Analyzer/Invocation.php",
    "composer/src/Sdk/Analyzer/IssueFilterContext.php",
    "composer/src/Sdk/Analyzer/Metadata/AttributeArgumentMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/ClassConstantMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/ClassLikeMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/ConstantExpression.php",
    "composer/src/Sdk/Analyzer/Metadata/ConstantMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/EnumCaseMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/FunctionLikeMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/MethodMetadataProjection.php",
    "composer/src/Sdk/Analyzer/Metadata/ParameterMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/PropertyHookMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/PropertyMetadata.php",
    "composer/src/Sdk/Analyzer/Metadata/TemplateMetadata.php",
    "composer/src/Sdk/Analyzer/PropertyInitializationProviderContext.php",
    "composer/src/Sdk/Analyzer/Type/CallableParameter.php",
    "composer/src/Sdk/Analyzer/Type/CallableSignature.php",
    "composer/src/Sdk/Analyzer/Type/ClassLikeStringType.php",
    "composer/src/Sdk/Analyzer/Type/NamedObjectType.php",
    "composer/src/Sdk/Analyzer/Type/ReferenceType.php",
    "composer/src/Sdk/Analyzer/Type/StringType.php",
    "composer/src/Sdk/Analyzer/Type/TypeFlags.php",
    "composer/src/Sdk/Extension.php",
    "composer/src/Sdk/Internal/Analyzer/CallForwardingRequest.php",
    "composer/src/Sdk/Internal/Analyzer/NodeAnalysisData.php",
    "composer/src/Sdk/Internal/Analyzer/Protocol.php",
    "composer/src/Sdk/Internal/Analyzer/RegisteredPlugin.php",
    "composer/src/Sdk/Linter/RuleDefinition.php",
    "composer/src/Sdk/Reporting/Issue.php",
    "composer/src/Sdk/Reporting/ReportedIssue.php",
    "composer/src/Sdk/Syntax/CallExpression.php",
    "composer/src/Sdk/Syntax/SourceFile.php",
    "composer/src/Sdk/Worker.php",
] }
kan-defect = { threshold = 1.9, exclude = [
    "composer/src/Sdk/Analyzer/Codebase.php",
    "composer/src/Sdk/Internal/Analyzer/AssertionCodec.php",
    "composer/src/Sdk/Internal/Analyzer/MetadataCodec.php",
    "composer/src/Sdk/Internal/Analyzer/Protocol.php",
    "composer/src/Sdk/Internal/Analyzer/TypeCodec.php",
    "composer/src/Sdk/Syntax/CallExpression.php",
    "composer/src/Sdk/Worker.php",
    "composer/tests/Sdk/Fixtures/",
    "composer/tests/Sdk/Unit/WorkerTest.php",
] }
halstead = { effort-threshold = 7000, exclude = [
    "composer/src/Sdk/Analyzer/FileAnalysis.php",
    "composer/src/Sdk/Internal/Analyzer/MetadataCodec.php",
    "composer/src/Sdk/Internal/Analyzer/Protocol.php",
    "composer/src/Sdk/Internal/Analyzer/TypeCodec.php",
    "composer/src/Sdk/Worker.php",
    "composer/tests/Sdk/Fixtures/",
] }
too-many-methods = { exclude = [
    "composer/src/Sdk/Analyzer/Codebase.php",
    "composer/src/Sdk/Analyzer/FileAnalysis.php",
    "composer/src/Sdk/Analyzer/PluginRegistry.php",
    "composer/src/Sdk/Analyzer/Type.php",
    "composer/src/Sdk/Internal/Analyzer/MetadataCodec.php",
    "composer/src/Sdk/Internal/Analyzer/Protocol.php",
    "composer/src/Sdk/Internal/Analyzer/TypeCodec.php",
    "composer/src/Sdk/Internal/Protocol/ValueReader.php",
    "composer/src/Sdk/Internal/Protocol/ValueWriter.php",
    "composer/src/Sdk/Syntax/SourceFile.php",
    "composer/src/Sdk/Worker.php",
    "composer/tests/Sdk/Fixtures/",
    "composer/tests/Sdk/Unit/Analyzer/InvocationTest.php",
    "composer/tests/Sdk/Unit/Analyzer/ValueTest.php",
    "composer/tests/Sdk/Unit/WorkerTest.php",
] }
too-many-properties = { exclude = ["composer/src/Sdk/Analyzer/PluginRegistry.php", "composer/src/Sdk/Worker.php"] }
literal-named-argument = { enabled = false }
# NodeKind lists every kind of node Mago's syntax tree has, as `just regen-sdk-node-kinds` writes it.
too-many-enum-cases = { threshold = 30, exclude = ["composer/src/Sdk/Syntax/NodeKind.php"] }
no-boolean-flag-parameter = { exclude = [
    "composer/src/Sdk/Internal/Analyzer/TypeCodec.php",
    "composer/src/Sdk/Internal/Protocol/PayloadWriter.php",
] }
no-error-control-operator = { exclude = ["composer/src/internal.php", "composer/tests/Internal/DownloadTest.php"] }
no-empty-catch-clause = { exclude = ["composer/src/internal.php"] }
# Enable disabled-by-default rules
no-redundant-use = { enabled = true }
no-variable-variable = { enabled = true }
no-redundant-readonly = { enabled = true }
sensitive-parameter = { enabled = true }
# Disable for scripts and for the SDK's worker fixtures
single-class-per-file = { exclude = ["scripts", "composer/tests/Sdk/Fixtures/"] }
file-name = { exclude = ["scripts", "composer/tests/Sdk/Fixtures/"] }

[analyzer]
find-unused-expressions = true
find-unused-definitions = true
analyze-dead-code = true
check-missing-override = true
find-unused-parameters = true
check-missing-type-hints = true
check-closure-missing-type-hints = true
check-arrow-function-missing-type-hints = true
strict-list-index-checks = true
no-boolean-literal-comparison = true
allow-possibly-undefined-array-keys = false
trust-existence-checks = false
check-use-statements = true
ignore = [
    # `#[Attribute]` names `Attribute::TARGET_CONSTANT`, which PHP 8.5 adds and an older PHP never reads.
    { code = "unavailable-class-constant", in = ["composer/src/AvailableSince.php", "composer/src/AvailableUntil.php"] },
    # Each decodes an attribute's or a constant's class from the class name the host sends.
    { code = "unknown-class-instantiation", in = [
        "composer/src/Sdk/Analyzer/Metadata/AttributeMetadata.php",
        "composer/src/Sdk/Analyzer/Metadata/ConstantExpression.php",
    ] },
    # A public method checks the values its docblock types, for a caller that passes others.
    { code = "impossible-condition", in = "composer/src/Sdk/Analyzer/TypeComparator.php" },
]
